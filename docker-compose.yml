# Prometheus + Grafana만 컨테이너로 띄운다.
# Go 서버는 호스트에서 `go run .` 으로 돌린다 — 고쳐가며 재시작하기 훨씬 빠르다.
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: traffic-lab-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:13.2.1
    container_name: traffic-lab-grafana
    ports:
      - "3000:3000"
    environment:
      # 학습용이라 로그인 생략. 열자마자 대시보드가 보인다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
